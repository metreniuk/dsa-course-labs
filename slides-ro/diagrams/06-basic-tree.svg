<rect width="400" height="315" rx="8" fill="#ffffff"/>
<path d="M182.3,65.7 L124.8,123.2" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="129.6" y="73.4" width="48" height="19" fill="#fff"/>
<text x="153.6" y="86.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">left</text>
<path d="M217.7,65.7 L275.2,123.2" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="222.4" y="73.4" width="48" height="19" fill="#fff"/>
<text x="246.4" y="86.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">right</text>
<path d="M93.4,165.1 L68.0,213.2" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="56.7" y="168.2" width="48" height="19" fill="#fff"/>
<text x="80.7" y="181.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">left</text>
<circle cx="200" cy="48" r="25" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="200" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">2</text>
<circle cx="105" cy="143" r="25" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="105" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">1</text>
<circle cx="295" cy="143" r="25" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
