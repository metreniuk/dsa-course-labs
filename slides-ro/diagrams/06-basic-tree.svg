<text x="55" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">4</text>
<text x="200" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">Root: 2. Leaves: 3 and 4.</text>
