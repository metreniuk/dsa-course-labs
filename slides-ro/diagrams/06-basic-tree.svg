<svg xmlns="http://www.w3.org/2000/svg" width="400" height="315" viewBox="0 0 400 315" role="img" aria-labelledby="title desc">
<title id="title">The four-node binary tree</title>
<desc id="desc">Root 2 has left child 1 and right child 3. Node 1 has left child 4.</desc>
